<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Set your password — UK Brewery Tours team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="login-body">
  <form class="login-card" id="form">
    <div class="login-brand">🍺 UK Brewery Tours</div>
    <h1>Set your password</h1>
    <p class="muted" style="font-size:.9rem;margin-bottom:4px">
      You were given a temporary password. Choose your own to carry on.
    </p>
    <label for="current">Temporary password</label>
    <input id="current" type="password" autocomplete="current-password" required autofocus>
    <label for="next">New password</label>
    <input id="next" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
    <p class="muted" style="font-size:.8rem;margin-top:8px">At least 12 characters.</p>
    <p class="error" id="error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="submit">Save and continue</button>
  </form>

<script>
const form = document.getElementById('form');
const errorEl = document.getElementById('error');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  const next = document.getElementById('next').value.trim();
  const confirm = document.getElementById('confirm').value.trim();
  if (next !== confirm) {
    errorEl.textContent = 'The two new passwords do not match.';
    errorEl.hidden = false;
    return;
  }
  submit.disabled = true;
  submit.textContent = 'Saving…';
  try {
    const res = await fetch('/api/team/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        current_password: document.getElementById('current').value,
        new_password: next,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save.');
    location.href = '/team/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.hidden = false;
    submit.disabled = false;
    submit.textContent = 'Save and continue';
  }
});
</script>
</body>
</html>
